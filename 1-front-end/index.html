<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Cadastro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base-url" content="http://localhost:3000">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main> 
        <h1>Cadastro</h1>
        <form id = "formulario-cadastro">
            <input type="text" name="nome" placeholder="Nome" autocomplete="given-name" required>
            <input type="text" name="sobrenome" placeholder="Sobrenome" autocomplete="family-name" required>
            <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
            <input type="password" name="senha" placeholder="Senha" autocomplete="new-password" required>
            <button type="submit">Cadastrar</button>
        </form>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
